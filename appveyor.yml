version: 1.0.{build}

image: Ubuntu2204

install:
  - sudo apt-get install -y libglu1-mesa
  - bash ./tests/ci-prepare.sh

environment:
  matrix:
    - BLENDER_VERSION: 2.79
    - BLENDER_VERSION: 3.6
    - BLENDER_VERSION: 4.3

test_script:
  - ./blender/$BLENDER_VERSION/blender --factory-startup -noaudio -b --python-exit-code 1 --python /home/appveyor/projects/blender-xray/tests/runner.py

after_test:
  - bash <(curl -s https://codecov.io/bash)

artifacts:
  - path: .tests

on_failure:
  - 7z a tests.zip .tests
  - appveyor PushArtifact tests.zip
